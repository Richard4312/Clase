    <main>
        
        
        <!-- Formulario web-->
        <h1>Contacto</h1>

        <h2>Escribinos</h2>


        <form action="contacto.html" method="post">
            <!--
          nombre
          telefono
          mail
          tamaño
          direccion
          Consulta
        -->
          <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">
            <label for="id-telefono">Telefono</label>
            <input type="tel" name="telefono" id="id-telefono">
            <label for="id-email">Email</label>
            <input type="email" name="email" id="id-email">
            <label for="id-tamaño">Tamaños</label>
            <select name="tamaño-mascota" id="id-tamaño">
                <option value="P">Pequeño</option>
                <option value="M">Mediano</option>
                <option value="G">Grande</option>

            </select>
            <label for="id-direccion">Direccion</label>
            <input type="text" name="direccion" id="id-direccion">
            <label for="id-comentario"> Comentarios</label>
            <textarea name="comentarios" id="id-comentario"></textarea>
            
            <!--                       -->

            <!-- <input type="submit" value="Enviar"> -->
            <button type="submit">Enviar</button>
            
        </form>
